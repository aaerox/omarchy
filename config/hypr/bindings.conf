# Application bindings
$terminal = uwsm-app -- xdg-terminal-exec
$browser = omarchy-launch-browser

bindd = SUPER, Q, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, RETURN, Terminal, exec, $terminal --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus feishin
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, $terminal -e btop
bindd = SUPER SHIFT, D, Docker, exec, $terminal -e lazydocker
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, Claude, exec, omarchy-launch-webapp "https://claude.ai"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"
bindd = SUPER SHIFT, H, Home Assistant, exec, omarchy-launch-webapp "https://home.jondaly.dev/dashboard-home/0"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Confine SUPER+TAB workspace cycling to the focused monitor (DP-2), so the
# audio-only DP-1 workspace never appears in the cycle. The omarchy default uses
# `e+1`/`e-1` (next/prev EXISTING workspace, across ALL monitors), which always
# lands on DP-1's held-open workspace. `m+1`/`m-1` cycle only the current
# monitor's workspaces. DP-1 stays connected for 7.1 audio.
unbind = SUPER, TAB
unbind = SUPER SHIFT, TAB
bindd = SUPER, TAB, Next workspace, workspace, m+1
bindd = SUPER SHIFT, TAB, Previous workspace, workspace, m-1

# Same fix for SUPER + scroll workspace cycling.
unbind = SUPER, mouse_down
unbind = SUPER, mouse_up
bindd = SUPER, mouse_down, Scroll active workspace forward, workspace, m+1
bindd = SUPER, mouse_up, Scroll active workspace backward, workspace, m-1

# Move between / push windows across monitors. Hyprland's numbered workspaces
# are global (a workspace lives on whichever monitor it was first opened on), so
# SUPER+[SHIFT+]number can't target "the focused monitor". These binds are the
# way to send a window to the projector (or back). Target the two REAL displays
# BY NAME (not mon:+1/-1) so a window can never be flung onto the audio-only
# DP-1 Anthem -- directional cycling would include it. (If the projector is off,
# moving to HDMI-A-1 is a harmless no-op.)
# Focus main display AND warp the cursor onto it -- doubles as a guaranteed
# "rescue" if the pointer ever gets stranded on the invisible audio DP-1 (the
# explicit movecursor works even with cursor:no_warps, which can suppress
# focusmonitor's own warp).
bindd = SUPER, comma, Focus main display, exec, hyprctl dispatch focusmonitor DP-2 && hyprctl dispatch movecursor 1600 700
bindd = SUPER, period, Focus projector, focusmonitor, HDMI-A-1
bindd = SUPER SHIFT, comma, Move window to main display, movewindow, mon:DP-2
bindd = SUPER SHIFT, period, Move window to projector, movewindow, mon:HDMI-A-1

# Display toggles
bindd = SUPER, F5, Toggle gaming mode, exec, omarchy-sunsetr-toggle-gaming
bindd = SUPER, F7, Toggle main display, exec, omarchy-monitor-toggle DP-2
bindd = SUPER, F8, Toggle projector, exec, omarchy-monitor-toggle HDMI-A-1

# Screenshots (no PrintScreen key)
bindd = SUPER SHIFT, S, Screenshot with editing, exec, omarchy-cmd-screenshot
bindd = SUPER SHIFT CTRL, S, Screenshot to clipboard, exec, omarchy-cmd-screenshot smart clipboard

# VDI clipboard tools
bindd = SUPER SHIFT, J, Screen OCR to clipboard, exec, ~/dev/nwg-capture/screen-ocr
bindrd = SUPER SHIFT, K, Type clipboard (VDI paste), exec, ~/dev/nwg-capture/type-clipboard
