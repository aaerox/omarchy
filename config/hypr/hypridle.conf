# }

# Blank ONLY the OLED (DP-2) on idle for burn-in protection. Scoped to DP-2 so
# DP-1 (the AV receiver) stays powered and 7.1 audio keeps working -- never use a
# bare `dpms off` here, that would kill the audio link. No lock, no dim by design.
listener {
    timeout = 300                                  # 5min
    on-timeout = hyprctl dispatch dpms off DP-2    # blank OLED only
    on-resume = hyprctl dispatch dpms on DP-2      # wake OLED on activity
}
