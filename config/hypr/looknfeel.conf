# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 8
}

# https://wiki.hypr.land/Configuring/Variables/
layout {
    # Avoid overly wide single-window layouts on wide screens
    single_window_aspect_ratio = 1.2 1
}

# Frosted-glass effect behind the auto-hiding AGS top bar (namespace "top-bar").
# Uses the 0.55 layerrule syntax -- the old "blur, top-bar" form does NOT parse.
# The bar's CSS background is kept semi-transparent (~0.5) so this blur shows
# through; ignore_alpha 0.3 must stay below that alpha. xray blurs the wallpaper
# (not live windows) and avoids a known top-bar glitch with "xray off".
layerrule = blur on, match:namespace top-bar
layerrule = ignore_alpha 0.3, match:namespace top-bar
layerrule = xray on, match:namespace top-bar

