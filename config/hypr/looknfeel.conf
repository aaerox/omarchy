# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    # gaps_in = 0
    # gaps_out = 0
    # border_size = 0

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 8
}

# https://wiki.hypr.land/Configuring/Variables/
layout {
    # Avoid overly wide single-window layouts on wide screens
    single_window_aspect_ratio = 1.2 1
}

# Auto-hiding AGS top bar (namespace "top-bar"): slide in/out on open/close, and
# a frosted blur backdrop behind it (bar CSS bg is semi-transparent so it shows).
layerrule = animation slide, match:namespace top-bar
layerrule = blur on, match:namespace top-bar
layerrule = ignore_alpha 0.2, match:namespace top-bar

