# Webcam overlay for screen recording
windowrule = match:title WebcamOverlay, float true
windowrule = match:title WebcamOverlay, pin true
windowrule = match:title WebcamOverlay, no_initial_focus true
windowrule = match:title WebcamOverlay, no_dim true
windowrule = match:title WebcamOverlay, move 100%-w-40 100%-w-40
